# Blueprint do Render (plano gratuito) para a API; o front segue no GitHub Pages (pasta docs/)
services:
  - type: web
    name: controle-financas-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        value: https://douglasabnovato.github.io
      - key: NODE_VERSION
        value: "22"
# fim de arquivo
